services:
  - type: web
    name: ai-video-backend
    runtime: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-video-db
          property: connectionString
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODELS
        value: gpt-oss-120b,llama-3.3-70b,llama3.1-8b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-2.0-flash,gemini-1.5-flash,gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: CORS_ORIGINS
        value: https://youtubesynopsis.vercel.app,https://youtubesynopsis-*.vercel.app
      - key: WEBSHARE_PROXY_URL
        sync: false

databases:
  - name: ai-video-db
    plan: free
