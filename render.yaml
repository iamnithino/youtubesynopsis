services:
  - type: web
    name: ai-video-caption-service
    runtime: node
    rootDir: caption-service
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CAPTION_SERVICE_SECRET
        generateValue: true
      - key: WEBSHARE_PROXY_URL
        sync: false

  - type: web
    name: ai-video-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-video-db
          property: connectionString
      - key: CAPTION_SERVICE_URL
        fromService:
          type: web
          name: ai-video-caption-service
          property: hostport
      - key: CAPTION_SERVICE_SECRET
        fromService:
          type: web
          name: ai-video-caption-service
          envVarKey: CAPTION_SERVICE_SECRET
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY_FAST
        sync: false
      - key: CEREBRAS_API_KEY_THIRD
        sync: false
      - key: CEREBRAS_API_KEY_USE_CASE
        sync: false
      - key: CEREBRAS_API_KEY_PRESENTATION
        sync: false
      - key: CEREBRAS_API_KEY_COMPARISON
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: CORS_ORIGINS
        value: https://youtubesynopsis.vercel.app,https://youtubesynopsis-*.vercel.app
      - key: WEBSHARE_PROXY_URL
        sync: false

databases:
  - name: ai-video-db
    plan: free
